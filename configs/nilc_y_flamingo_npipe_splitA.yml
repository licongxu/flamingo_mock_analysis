# pyILC NILC Compton-y on FLAMINGO mock skies + Planck NPIPE noise (split A, mc_00200).
# ELLMAX=3000, N_side=2048. Channel beams = Planck HFI
# Gaussians applied by flamingo_mock.ilc.prepare; common ILC beam 5'.
# ILC weight backend: jax (override with PYILC_BACKEND).
work_in_healpix: 'yes'
output_dir: /rds/rds-lxu/flamingo/integrated_maps_synthetic/ilc/nilc_output_npipe_splitA/
output_prefix: flamingo_
output_suffix: _nilc_y_npipe_splitA
save_weights: 'yes'
save_as: fits
param_dict_file: /scratch/scratch-lxu/agent_dev/auto_research_agent/pyilc/input/fg_SEDs_default_params.yml
ELLMAX: 3000
taper_width: 150
N_side: 2048
N_freqs: 3
bandpass_type: DeltaBandpasses
freqs_delta_ghz: [100.0, 143.0, 353.0]
freq_map_files: [/rds/rds-lxu/flamingo/integrated_maps_synthetic/ilc/inputs_nside2048_npipe/sky_CMB_tSZ_kSZ_CIB_npipe_splitA_100GHz_nside2048_K.fits,
  /rds/rds-lxu/flamingo/integrated_maps_synthetic/ilc/inputs_nside2048_npipe/sky_CMB_tSZ_kSZ_CIB_npipe_splitA_143GHz_nside2048_K.fits,
  /rds/rds-lxu/flamingo/integrated_maps_synthetic/ilc/inputs_nside2048_npipe/sky_CMB_tSZ_kSZ_CIB_npipe_splitA_353GHz_nside2048_K.fits]
beam_type: Gaussians
beam_FWHM_arcmin: [9.66, 7.22, 4.92]
perform_ILC_at_beam: 5.0
ILC_preserved_comp: tSZ
N_deproj: 0
ILC_deproj_comps: []
N_maps_xcorr: 0
print_timing: 'true'
ilc_backend: jax
wavelet_type: GaussianNeedlets
N_scales: 10
GN_FWHM_arcmin: [600.0, 300.0, 120.0, 60.0, 30.0, 15.0, 10.0, 7.5, 5.0]
N_SED_params: 0
SED_params: []
SED_params_vals: []
SED_params_priors: []
SED_params_priors_params: []
ILC_bias_tol: 0.01
