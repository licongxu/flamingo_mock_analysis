# Fiducial FLAMINGO CIB SED from Yang et al. (arXiv:2512.09891), Sec. 3.5.
# beta_d = 1.65, T_0 = 35.14 K. Their alpha is consistent with no redshift
# evolution, so this is a single dust temperature. pyILC has no redshift stack
# or Planck bandpass, which the maps include.
Tdust_CIB: 35.14
beta_CIB: 1.65
nu0_CIB_ghz: 353.0
kT_e_keV: 5.0
nu0_radio_ghz: 150.0
beta_radio: -0.5
