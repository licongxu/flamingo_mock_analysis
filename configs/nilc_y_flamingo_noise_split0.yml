# Needlet ILC (Gaussian needlets) on FLAMINGO mock + FFP10 noise split 0.
# Paper-style needlets; ELLMAX=3000; channel beams match prep; common ILC beam 5'.

work_in_healpix: 'yes'
output_dir: '/home/ext_andyxlcnb_gmail_com/cosmology_data/flamingo_ilc/nilc_output_noise_split0/'
output_prefix: 'flamingo_'
output_suffix: '_nilc_y_noise_split0'
save_weights: 'yes'
save_as: 'fits'

param_dict_file: '/home/ext_andyxlcnb_gmail_com/software_packages/pyilc/input/fg_SEDs_default_params.yml'

ELLMAX: 3000
taper_width: 150
N_side: 2048

wavelet_type: 'GaussianNeedlets'
N_scales: 10
GN_FWHM_arcmin: [600., 300., 120., 60., 30., 15., 10., 7.5, 5.]

N_freqs: 3
bandpass_type: 'DeltaBandpasses'
freqs_delta_ghz: [100.0, 143.0, 353.0]

freq_map_files:
  - '/home/ext_andyxlcnb_gmail_com/cosmology_data/flamingo_ilc/inputs_nside2048_noise/sky_CMB_tSZ_CIB_noise_split0_100GHz_nside2048_K.fits'
  - '/home/ext_andyxlcnb_gmail_com/cosmology_data/flamingo_ilc/inputs_nside2048_noise/sky_CMB_tSZ_CIB_noise_split0_143GHz_nside2048_K.fits'
  - '/home/ext_andyxlcnb_gmail_com/cosmology_data/flamingo_ilc/inputs_nside2048_noise/sky_CMB_tSZ_CIB_noise_split0_353GHz_nside2048_K.fits'

beam_type: 'Gaussians'
beam_FWHM_arcmin: [9.66, 7.22, 4.92]
perform_ILC_at_beam: 5.0

ILC_preserved_comp: 'tSZ'
N_deproj: 0
ILC_deproj_comps: []
N_SED_params: 0
SED_params: []
SED_params_vals: []
SED_params_priors: []
SED_params_priors_params: []

N_maps_xcorr: 0
ILC_bias_tol: 0.01
print_timing: 'true'
ilc_backend: 'numba'
