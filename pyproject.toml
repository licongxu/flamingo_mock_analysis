[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flamingo-mock"
version = "0.1.0"
description = "Synthetic multi-frequency CMB sky maps from FLAMINGO (Yang et al. 2026) integrated lightcone maps"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "healpy",
    "astropy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
# Only needed for the lensed primary CMB step
cmb = ["camb", "pixell"]
# Compton-y ILC: pyILC (agent_evolve branch) is installed separately from the
# local checkout, e.g. pip install -e /scratch/scratch-lxu/agent_dev/auto_research_agent/pyilc
# GPU backends: jax[cuda13] or cupy-cuda12x.
ilc = ["jax"]

[project.scripts]
flamingo-mock-maps = "flamingo_mock.cli:main"
flamingo-ilc = "flamingo_mock.ilc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
